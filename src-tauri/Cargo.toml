[package]
name = "tranova"
version = "0.1.2"
description = "AI translation studio for text and documents"
authors = ["Tranova contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "tranova_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "tranova"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22"
csv = "1.3"
directories = "6"
mime_guess = "2"
parking_lot = "0.12"
quick-xml = "0.37"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "time"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
zip = { version = "0.6", default-features = false, features = ["deflate"] }
